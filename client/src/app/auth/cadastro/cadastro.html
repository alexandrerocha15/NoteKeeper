<main>
  <h1>Criar conta no NoteKeeper</h1>
  <p>Cadastre-se para começar a organizar suas notas.</p>

  <form (ngSubmit)="cadastrar()">
    <div>
      <label for="nome">Nome</label>
      <input
        id="nome"
        type="text"
        name="nome"
        [(ngModel)]="nome"
        placeholder="Seu nome"
        required
      />
    </div>

    <div>
      <label for="email">E-mail</label>
      <input
        id="email"
        type="email"
        name="email"
        [(ngModel)]="email"
        placeholder="seu@email.com"
        required
      />
    </div>

    <div>
      <label for="senha">Senha</label>
      <input
        id="senha"
        type="password"
        name="senha"
        [(ngModel)]="senha"
        placeholder="Crie uma senha"
        required
      />
    </div>

    <div>
      <label for="confirmarSenha">Confirmar senha</label>
      <input
        id="confirmarSenha"
        type="password"
        name="confirmarSenha"
        [(ngModel)]="confirmarSenha"
        placeholder="Repita sua senha"
        required
      />
    </div>

    @if (erro()) {
      <p>{{ erro() }}</p>
    }

    <button type="submit" [disabled]="carregando()">
      {{ carregando() ? 'Cadastrando...' : 'Criar conta' }}
    </button>
  </form>

  <p>
    Já possui uma conta?
    <a routerLink="/login">Entrar</a>
  </p>
</main>
